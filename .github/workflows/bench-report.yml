name: Benchmark report

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bench-report:
    name: Full benchmark + doc PR
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install the torchfits subject and comparators
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "torchfits>=1.2.1" numpy astropy fitsio pytest pyarrow pandas psutil matplotlib
          pip install -e . --no-deps

      - name: Run bench-all (lab profile)
        run: |
          RUN_ID="ci_$(date -u +%Y%m%d_%H%M%S)"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          python benchmarks/bench_all.py --profile lab --scope all --run-id "$RUN_ID"

      - name: Patch docs/benchmarks.md
        run: |
          CSV="benchmarks_results/${RUN_ID}/results.csv"
          DEFICITS="benchmarks_results/${RUN_ID}/torchfits_deficits.csv"
          python scripts/patch_bench_docs.py \
            --csv "$CSV" \
            --deficits "$DEFICITS" \
            --run-id "$RUN_ID"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ env.RUN_ID }}
          path: benchmarks_results/${{ env.RUN_ID }}/

      - name: Open PR with doc updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/bench-report-${RUN_ID}"
          git checkout -b "$BRANCH"
          # The page now cites $RUN_ID, so the CSVs have to be committed next to
          # it: the artifacts uploaded above expire, and
          # tests/test_docs_integrity.py::
          # test_benchmark_run_ids_match_published_assets requires every cited
          # run to have a docs/assets/bench/<run-id>/ directory. Without this the
          # PR fails the docs-contract job the moment it is opened.
          mkdir -p "docs/assets/bench/${RUN_ID}"
          cp "benchmarks_results/${RUN_ID}/results.csv" \
             "benchmarks_results/${RUN_ID}/torchfits_deficits.csv" \
             "docs/assets/bench/${RUN_ID}/"
          git add docs/benchmarks.md "docs/assets/bench/${RUN_ID}"
          git diff --staged --quiet && echo "No doc changes" && exit 0
          git commit -m "chore: benchmark report ${RUN_ID}"
          git push -u origin "$BRANCH"
          gh pr create --title "chore: benchmark report ${RUN_ID}" \
            --body "Automated bench-all run. Artifacts: benchmarks_results/${RUN_ID}/" || echo "PR creation skipped or not permitted by repository settings"
