name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Subject smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install torchfits subject and comparators
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "torchfits>=1.2.1" "numpy>=1.26" "astropy>=6.1" "fitsio>=1.4" "pytest>=9" "pyarrow>=25,<26" "pandas>=2.2" "psutil>=5"
          pip install -e . --no-deps
      - name: Import subject
        run: python -c "import torchfits, torchfits_harness; print(torchfits_harness.subject())"
      - name: Install fitsverify (conda-forge)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: fitsverify
          create-args: >-
            -c conda-forge
            fitsverify
      - name: Upstream parity smokes
        run: pytest tests/test_fitsio_upstream_smoke.py tests/test_astropy_upstream_smoke.py tests/test_layout.py tests/test_verify_vs_fitsverify.py -q
      - name: Benchmark smoke
        run: python benchmarks/bench_cpp_backend.py
